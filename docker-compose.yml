version: '3.8'

networks:
  app_network:
    driver: bridge

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - attachments_data:/data/attachments
    # Published on loopback only: db/redis/ollama/backend are reachable from this
    # machine (local dev tools) but not from the network. nginx (frontend) is
    # the only public entry point.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sicms}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-devredispass}@redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_LOCAL_PATH=/data/attachments
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-100}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_PREFIX=${S3_PREFIX:-}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - app_network
    dns:
      - 8.8.8.8
      - 8.8.4.4

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-sicms}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD:-devredispass}
    environment:
      # lets redis-cli (healthcheck, `docker compose exec redis redis-cli`) authenticate
      - REDISCLI_AUTH=${REDIS_PASSWORD:-devredispass}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODEL=llama3
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    # -B embeds Celery beat (the periodic-task scheduler) in this same
    # process — fine for a single worker replica; split into a separate
    # `beat` service if this is ever scaled to multiple worker replicas.
    command: celery -A app.worker.celery_app worker -B --loglevel=info
    volumes:
      - ./backend:/app
      - attachments_data:/data/attachments
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sicms}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-devredispass}@redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_LOCAL_PATH=/data/attachments
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-100}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_PREFIX=${S3_PREFIX:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-100}
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  ollama_data:
  attachments_data:
