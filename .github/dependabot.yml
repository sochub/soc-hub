version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "ci"}
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "build"}
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors that need a deliberate migration: TypeScript 7 is the Go rewrite; @types/node tracks the runtime.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "build"}
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "build"}
    groups:
      docker-backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "build"}
    groups:
      docker-frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Move Node by hand, LTS to LTS (even majors only).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
