version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "ci"}
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "build"}
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "build"}
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "build"}
    groups:
      docker-backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    commit-message: {prefix: "build"}
    groups:
      docker-frontend-minor-patch:
        update-types: [minor, patch]
