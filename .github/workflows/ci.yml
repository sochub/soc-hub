name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sicms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d sicms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/sicms
      REDIS_URL: redis://:ci-redis-pass@localhost:6379/0
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      # CI uses throwaway credentials; ENVIRONMENT=test turns the production
      # credential guard (app/core/config.py) into warnings.
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      # Service containers can't take a command, so start Redis with
      # --requirepass directly (the app requires an authenticated Redis).
      - name: Start Redis (password-protected)
        run: |
          docker run -d --name redis -p 6379:6379 redis:7 redis-server --requirepass ci-redis-pass
          for _ in $(seq 1 20); do
            docker exec redis redis-cli -a ci-redis-pass --no-auth-warning ping | grep -q PONG && exit 0
            sleep 1
          done
          echo "redis did not start" && exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for python3-saml (xmlsec)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev libxmlsec1-dev libxmlsec1-openssl pkg-config
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # There is existing lint debt; report it without failing the build
      # until it's paid down.
      - run: npm run lint
        continue-on-error: true

  audit-npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  audit-pip:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: System libraries for python3-saml (xmlsec)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev libxmlsec1-dev libxmlsec1-openssl pkg-config
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
