# Checkov config for .github/workflows/security.yml (rendered Helm chart + Dockerfiles).
# Skipped checks are deliberate; each line says why.
skip-check:
  - CKV_K8S_21  # default namespace: templates omit metadata.namespace on purpose, Helm sets it at install
  - CKV_K8S_43  # image digest: opt-in via images.*.digest (tags default to the chart appVersion)
  - CKV_K8S_15  # imagePullPolicy Always: tags are immutable release tags; IfNotPresent is intended
  - CKV_K8S_11  # CPU limits: deliberately unset (throttling hurts latency); requests + memory limits are set
  - CKV_K8S_35  # secrets as env: the app reads its settings from the environment (pydantic-settings)
  - CKV_K8S_8   # liveness probe: worker/beat/slack-socket/migrate expose no HTTP port
  - CKV_K8S_9   # readiness probe: same as above
  - CKV_K8S_40  # uid > 10000: nginx-unprivileged is uid 101 and the Bitnami images 1001; ours run as 10001/10002
