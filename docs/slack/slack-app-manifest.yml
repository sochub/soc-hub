# Slack app manifest for sochub (Socket Mode: Slack talks to sochub over an outbound WebSocket,
# so no public URL is needed).
# 1. Slack: Create New App > From an app manifest > paste this > Create > Install to Workspace.
#    Existing app: App Manifest > paste > Save, then Reinstall to Workspace
#    (required: new scopes only take effect after reinstalling).
# 2. Basic Information > App-Level Tokens > Generate, scope connections:write -> xapp-... token.
# 3. sochub > Settings > Integrations > Slack: paste the bot token (xoxb-) and the app-level token (xapp-).
# Prefer HTTP request URLs instead? See docs/slack/setup.md ("HTTP mode").
display_information:
  name: sochub
  description: Incident response from Slack. Create cases, get paged and run war rooms with sochub
  background_color: "#111113"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: sochub
    always_online: true
  slash_commands:
    - command: /sochub
      description: Create, find and work sochub cases
      usage_hint: "new [title] | case <id> | mine | help"
      should_escape: false
  shortcuts:
    - name: Create sochub case
      type: message
      callback_id: create_case_from_message
      description: Turn this message into a sochub case
    - name: New sochub case
      type: global
      callback_id: create_case
      description: Open the new-case form
oauth_config:
  scopes:
    bot:
      - chat:write          # cards, alerts, DMs
      - im:write            # open DMs with responders
      - users:read          # resolve who clicked
      - users:read.email    # link Slack users to sochub users by email
      - commands            # /sochub
      - channels:manage     # public war rooms created before private rooms (legacy)
      - groups:write        # create private war-room channels and invite responders
      - groups:read         # look up private war-room channels
      - groups:history      # SOC-bot reads human messages in private war rooms
      - channels:history    # same, for war rooms created as public channels
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.groups      # human messages in private war rooms (SOC-bot listening)
      - message.channels    # same, for legacy public war rooms
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
