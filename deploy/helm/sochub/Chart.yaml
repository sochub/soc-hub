apiVersion: v2
name: sochub
description: SOC Hub case management (FastAPI backend, Celery worker, nginx frontend)
type: application
version: 0.2.0
appVersion: "7.4.0"
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: 21.2.14
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
