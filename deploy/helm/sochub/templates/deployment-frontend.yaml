apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sochub.fullname" . }}-frontend
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "sochub.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sochub.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "sochub.podSecurity" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "sochub.image" (dict "img" .Values.images.frontend "ctx" .) }}
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_UPSTREAM
              value: "http://{{ include "sochub.fullname" . }}-api:8000"
            - name: MAX_UPLOAD_MB
              value: {{ .Values.config.maxUploadMb | quote }}
            {{- with .Values.frontend.hstsHeader }}
            {{- if hasPrefix "add_header" . }}
            {{- fail "frontend.hstsHeader takes only the header value, e.g. \"max-age=31536000; includeSubDomains\"" }}
            {{- end }}
            - name: HSTS_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.frontend.realIpFrom }}
            - name: REAL_IP_FROM
              value: {{ . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "sochub.containerSecurity" . | nindent 12 }}
          # nginx writes only its pid/temp files (/tmp) and the rendered config templates (conf.d).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: confd
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: confd
          emptyDir: {}
