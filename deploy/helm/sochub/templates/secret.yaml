{{- if not .Values.existingSecret }}
{{- /* Keys left empty are generated once and kept across upgrades via lookup. */ -}}
{{- $name := include "sochub.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $secretKey := .Values.secrets.SECRET_KEY | default (get $existing "SECRET_KEY" | b64dec) }}
{{- $encKey := .Values.secrets.ENCRYPTION_KEY | default (get $existing "ENCRYPTION_KEY" | b64dec) }}
{{- if and (not .Values.secrets.generate) (or (not $secretKey) (not $encKey)) }}
{{- fail "secrets.ENCRYPTION_KEY (and SECRET_KEY) must be set, or use existingSecret — generated keys are unsafe with GitOps" }}
{{- end }}
{{- $secretKey = $secretKey | default (randAlphaNum 64) }}
{{- $encKey = $encKey | default (randAlphaNum 64) }}
{{- $dbUrl := .Values.secrets.DATABASE_URL }}
{{- if and (not $dbUrl) .Values.postgresql.enabled }}{{ $dbUrl = include "sochub.databaseUrl" . }}{{ end }}
{{- $redisUrl := .Values.secrets.REDIS_URL }}
{{- if and (not $redisUrl) .Values.redis.enabled }}{{ $redisUrl = include "sochub.redisUrl" . }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  ENCRYPTION_KEY: {{ $encKey | quote }}
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required when postgresql.enabled=false" $dbUrl | quote }}
  REDIS_URL: {{ required "secrets.REDIS_URL is required when redis.enabled=false" $redisUrl | quote }}
  {{- if .Values.smtp.password }}
  SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
  {{- end }}
{{- end }}
