{{- /* Bundled PostgreSQL/Redis passwords: auth.password if set, else the value kept in the datastore Secret,
     else generated once. The Bitnami subcharts read the same Secret (auth.existingSecret). */ -}}
{{- if and (not .Values.secrets.generate) (or (and .Values.postgresql.enabled (not .Values.postgresql.auth.password)) (and .Values.redis.enabled (not .Values.redis.auth.password))) }}
{{- fail "postgresql.auth.password and redis.auth.password must be set when secrets.generate=false (or disable the bundled subcharts)" }}
{{- end }}
{{- $dsName := include "sochub.datastoreSecretName" . }}
{{- $ds := (lookup "v1" "Secret" .Release.Namespace $dsName).data | default dict }}
{{- $pgPassword := .Values.postgresql.auth.password | default (get $ds "password" | b64dec) | default (randAlphaNum 32) }}
{{- $pgAdminPassword := get $ds "postgres-password" | b64dec | default (randAlphaNum 32) }}
{{- $redisPassword := .Values.redis.auth.password | default (get $ds "redis-password" | b64dec) | default (randAlphaNum 32) }}
{{- if or .Values.postgresql.enabled .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dsName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $pgPassword | quote }}
  postgres-password: {{ $pgAdminPassword | quote }}
  redis-password: {{ $redisPassword | quote }}
---
{{- end }}
{{- if not .Values.existingSecret }}
{{- /* Keys left empty are generated once and kept across upgrades via lookup. */ -}}
{{- $name := include "sochub.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $secretKey := .Values.secrets.SECRET_KEY | default (get $existing "SECRET_KEY" | b64dec) }}
{{- $encKey := .Values.secrets.ENCRYPTION_KEY | default (get $existing "ENCRYPTION_KEY" | b64dec) }}
{{- if and (not .Values.secrets.generate) (or (not $secretKey) (not $encKey)) }}
{{- fail "secrets.ENCRYPTION_KEY (and SECRET_KEY) must be set, or use existingSecret — generated keys are unsafe with GitOps" }}
{{- end }}
{{- $secretKey = $secretKey | default (randAlphaNum 64) }}
{{- $encKey = $encKey | default (randAlphaNum 64) }}
{{- $dbUrl := .Values.secrets.DATABASE_URL }}
{{- if and (not $dbUrl) .Values.postgresql.enabled }}{{ $dbUrl = include "sochub.databaseUrl" (dict "ctx" . "password" $pgPassword) }}{{ end }}
{{- $redisUrl := .Values.secrets.REDIS_URL }}
{{- if and (not $redisUrl) .Values.redis.enabled }}{{ $redisUrl = include "sochub.redisUrl" (dict "ctx" . "password" $redisPassword) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  ENCRYPTION_KEY: {{ $encKey | quote }}
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required when postgresql.enabled=false" $dbUrl | quote }}
  REDIS_URL: {{ required "secrets.REDIS_URL is required when redis.enabled=false" $redisUrl | quote }}
  {{- if .Values.smtp.password }}
  SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
  {{- end }}
{{- end }}
