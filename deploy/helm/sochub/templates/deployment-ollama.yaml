{{- if .Values.ollama.enabled }}
{{- if .Values.ollama.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sochub.fullname" . }}-ollama
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.ollama.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sochub.fullname" . }}-ollama
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sochub.selectorLabels" (dict "ctx" . "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sochub.selectorLabels" (dict "ctx" . "component" "ollama") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "sochub.podSecurity" (dict "uid" 10002) | nindent 8 }}
      containers:
        - name: ollama
          image: {{ include "sochub.image" (dict "img" .Values.ollama.image "ctx" .) }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
          env:
            # Non-root: keys and models live under $HOME/.ollama, i.e. on the models volume.
            - name: HOME
              value: /ollama
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          securityContext:
            {{- include "sochub.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /ollama
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: models
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sochub.fullname" . }}-ollama
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sochub.fullname" . }}-ollama
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sochub.selectorLabels" (dict "ctx" . "component" "ollama") | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
{{- end }}
