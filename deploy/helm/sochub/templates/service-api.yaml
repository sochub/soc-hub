apiVersion: v1
kind: Service
metadata:
  name: {{ include "sochub.fullname" . }}-api
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "sochub.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
