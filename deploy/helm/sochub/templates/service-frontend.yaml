apiVersion: v1
kind: Service
metadata:
  name: {{ include "sochub.fullname" . }}-frontend
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "sochub.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
