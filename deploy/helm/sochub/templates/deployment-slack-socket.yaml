{{- if .Values.slackSocket.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sochub.fullname" . }}-slack-socket
  labels:
    {{- include "sochub.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-socket
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sochub.selectorLabels" (dict "ctx" . "component" "slack-socket") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sochub.selectorLabels" (dict "ctx" . "component" "slack-socket") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "sochub.podSecurity" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: slack-socket
          image: {{ include "sochub.backendImage" . }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["python", "-m", "app.slack_socket"]
          envFrom:
            {{- include "sochub.backendEnvFrom" . | nindent 12 }}
          env:
            {{- include "sochub.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.slackSocket.resources | nindent 12 }}
          securityContext:
            {{- include "sochub.containerSecurity" . | nindent 12 }}
          volumeMounts:
            {{- include "sochub.scratchMounts" . | nindent 12 }}
      volumes:
        {{- include "sochub.scratchVolumes" . | nindent 8 }}
{{- end }}
