# Example production overrides:  helm install sochub deploy/helm/sochub -f values-production.yaml
images:
  backend: {repository: registry.example.com/sochub/sochub-backend, tag: "1.0.0"}
  frontend: {repository: registry.example.com/sochub/sochub-frontend, tag: "1.0.0"}

# Secret created out-of-band with keys SECRET_KEY, ENCRYPTION_KEY, DATABASE_URL, REDIS_URL:
#   kubectl create secret generic sochub-secrets --from-literal=SECRET_KEY=$(openssl rand -hex 32) ...
existingSecret: sochub-secrets

# External managed PostgreSQL / Redis.
postgresql: {enabled: false}
redis: {enabled: false}

config:
  frontendUrl: https://sochub.example.com
  publicBaseUrl: https://sochub.example.com

frontend:
  replicas: 2
  hstsHeader: 'add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;'

api:
  replicas: 2   # >1 api replica requires RWX storage or S3 (below)

persistence:
  attachments:
    size: 50Gi
    storageClass: efs-sc        # RWX-capable class, required on multi-node clusters
    accessMode: ReadWriteMany   # api AND worker write attachments

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  hosts:
    - host: sochub.example.com
  tls:
    - secretName: sochub-tls
      hosts: [sochub.example.com]
