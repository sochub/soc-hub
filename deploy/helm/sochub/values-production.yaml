# Example production overrides:  helm install sochub deploy/helm/sochub -f values-production.yaml
# tag defaults to the chart appVersion; pin the digest you verified (cosign verify, see docs/deployment.md).
images:
  backend: {repository: registry.example.com/sochub/sochub-backend, digest: ""}
  frontend: {repository: registry.example.com/sochub/sochub-frontend, digest: ""}

# Secret created out-of-band with keys SECRET_KEY, ENCRYPTION_KEY, DATABASE_URL, REDIS_URL:
#   kubectl create secret generic sochub-secrets --from-literal=SECRET_KEY=$(openssl rand -hex 32) ...
existingSecret: sochub-secrets

# External managed PostgreSQL / Redis.
postgresql: {enabled: false}
redis: {enabled: false}

config:
  frontendUrl: https://sochub.example.com
  publicBaseUrl: https://sochub.example.com

frontend:
  replicas: 2
  hstsHeader: "max-age=31536000; includeSubDomains"
  realIpFrom: "10.0.0.0/8"   # your cluster's pod CIDR (where the ingress controller pods live)

api:
  replicas: 2   # >1 api replica requires RWX storage or S3 (below)

persistence:
  attachments:
    size: 50Gi
    storageClass: efs-sc        # RWX-capable class, required on multi-node clusters
    accessMode: ReadWriteMany   # api AND worker write attachments

networkPolicy:
  ingressFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  hosts:
    - host: sochub.example.com
  tls:
    - secretName: sochub-tls
      hosts: [sochub.example.com]
