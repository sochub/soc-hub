# Production stack from the published images (no source checkout or build needed).
#
#   cp .env.prod.example .env      # fill in every secret and SOCHUB_TAG
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm backend python -m app.scripts.create_super_admin --email you@example.com
#
# `migrate` applies database migrations on every start and exits; backend and
# worker wait for it. Put a TLS-terminating proxy (Caddy, Traefik, a cloud load
# balancer) in front of port 80. See docs/deployment.md for Fargate and Kubernetes.
#
# Every SOC Hub container runs with a read-only root filesystem, no capabilities, no privilege
# escalation and pid/memory caps. Writable paths are tmpfs: /tmp (Celery beat schedule, spooled
# upload temp files, nginx pid/temp) and the app user's HOME (fontconfig cache for PDF export).

x-backend: &backend
  # No floating default: pin a release (e.g. 1.4.0) in .env so an upgrade is a deliberate change.
  image: docker.io/sochub/sochub-backend:${SOCHUB_TAG:?set SOCHUB_TAG in .env to a release such as 1.4.0}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp
    - /home/app:uid=10001,gid=10001
  pids_limit: 512
  mem_limit: 1g
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ENVIRONMENT: production
    STORAGE_LOCAL_PATH: /data/attachments
    LITELLM_LOCAL_MODEL_COST_MAP: "True"
  volumes:
    - attachments_data:/data/attachments

services:
  db:
    image: postgres:15.19
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: alembic upgrade head
    mem_limit: 512m
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    # Scale freely (`--scale worker=N`): the scheduler runs in the separate `beat` service.
    # Consumes the default queue plus the 'automation' queue that workflow tasks are routed to;
    # keep this -Q list in step with the queue names in app/worker.py.
    command: celery -A app.worker.celery_app worker -Q celery,automation --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery beat (periodic-task scheduler): exactly ONE replica, or scheduled jobs run twice.
  beat:
    <<: *backend
    command: celery -A app.worker.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    mem_limit: 256m
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Slack Socket Mode (exactly one replica is enough; idles when no tenant uses it).
  slack-socket:
    <<: *backend
    command: python -m app.slack_socket
    mem_limit: 512m
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: docker.io/sochub/sochub-frontend:${SOCHUB_TAG:?set SOCHUB_TAG in .env to a release such as 1.4.0}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101   # rendered config templates
    pids_limit: 128
    mem_limit: 256m
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      BACKEND_UPSTREAM: http://backend:8000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # See .env.prod.example: HSTS once served over HTTPS; REAL_IP_FROM = address of your TLS proxy.
      HSTS_HEADER: ${HSTS_HEADER:-}
      REAL_IP_FROM: ${REAL_IP_FROM:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  attachments_data:
