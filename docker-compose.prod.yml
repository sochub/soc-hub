# Production stack from the published images (no source checkout or build needed).
#
#   cp .env.prod.example .env      # fill in every secret
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm backend python -m app.scripts.create_super_admin --email you@example.com
#
# `migrate` applies database migrations on every start and exits; backend and
# worker wait for it. Put a TLS-terminating proxy (Caddy, Traefik, a cloud load
# balancer) in front of port 80. See docs/deployment.md for Fargate and Kubernetes.

x-backend: &backend
  image: docker.io/sochub/sochub-backend:${SOCHUB_TAG:-latest}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ENVIRONMENT: production
    STORAGE_LOCAL_PATH: /data/attachments
    LITELLM_LOCAL_MODEL_COST_MAP: "True"
  volumes:
    - attachments_data:/data/attachments

services:
  db:
    image: postgres:15
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: alembic upgrade head
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    # -B embeds Celery beat: run exactly one worker replica (or split beat out).
    command: celery -A app.worker.celery_app worker -B --loglevel=info -s /tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: docker.io/sochub/sochub-frontend:${SOCHUB_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      BACKEND_UPSTREAM: http://backend:8000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    depends_on:
      - backend

volumes:
  postgres_data:
  attachments_data:
